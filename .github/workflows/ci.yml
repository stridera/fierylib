name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Some tests read ../muditor/packages/db/prisma/schema.prisma, so muditor is
      # checked out as a sibling of fierylib (both under $GITHUB_WORKSPACE).
      PRISMA_SCHEMA_PATH: ../muditor/packages/db/prisma/schema.prisma
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
        with:
          path: fierylib
      - uses: actions/checkout@v4
        with:
          repository: stridera/muditor
          path: muditor
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Lua (trigger syntax tests shell out to it)
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        working-directory: fierylib
        run: poetry install --no-interaction
      - name: Generate Prisma client
        working-directory: fierylib
        run: bash scripts/prisma_generate.sh
      - name: Run tests
        working-directory: fierylib
        run: poetry run pytest -q
